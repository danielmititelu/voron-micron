
##########################################
# Based on Print Start Macro from Jontek https://github.com/jontek2/A-better-print_start-macro #
# Slicer Starting Gcode:
# 
# SuperSlicer: 
# M104 S0 ; Stops SuperSlicer from sending temp waits separately
# M140 S0
# PRINT_START EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature]
#
# PrusaSlicer:
# M104 S0 ; Stops PrusaSlicer from sending temp waits separately
# M140 S0
# PRINT_START EXTRUDER=[first_layer_temperature[initial_extruder]] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature]
#
# OrcaSlicer:
# M104 S0 ; Stops OrcaSlicer from sending temp waits separately
# M140 S0
# PRINT_START EXTRUDER=[first_layer_temperature] BED=[first_layer_bed_temperature] CHAMBER=[chamber_temperature]
#
##########################################

[gcode_macro PRINT_START]
gcode:
  # This part fetches data from your slicer. Such as bed, extruder, and chamber temps and size of your printer.
  {% set target_bed = params.BED|int %}
  {% set target_extruder = params.EXTRUDER|int %}
  {% set target_chamber = params.CHAMBER|default(0)|float %}
  {% set x_wait = printer.toolhead.axis_maximum.x|float / 2 %}
  {% set y_wait = printer.toolhead.axis_maximum.y|float / 2 %}

   SET_DISPLAY_TEXT MSG="Print Starting: Hotend:{target_extruder}c, Bed: {target_bed}c, Chamber: {target_chamber}c" 
  # Home the printer, set absolute positioning and update the Stealthburner LEDs.
  G28                                                   # Full home (XYZ)
  G90                                                   # Absolute position
 
  BED_MESH_CLEAR                                        # Clear the mesh from the previous print

  PARK                                                  # Go to center of the bed
  SET_DISPLAY_TEXT MSG="Bed: {target_bed}c"             # Display info on display
  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak and toggle filter.
  {% if params.BED|int > 90 %}
    M106 S255                                           # Turn on the part cooling fan
    FILTER_ON                                           # Turn on the filter
    BED_FANS_ON                                         # Circulate air while the bed heats
    M140 S{target_bed}                                  # Set the target temp for the bed
  {% endif %}
  M190 S{target_bed}                                   # Set the target temp for the bed

  # Heat hotend to 150c. This helps with getting a correct Z-home.
  SET_DISPLAY_TEXT MSG="Hotend: 150c"                  # Display info on display
  M109 S150                                            # Heat hotend to 150c

  SET_DISPLAY_TEXT MSG="Leveling"                      # Display info on display
  Attach_Probe_Lock                                    # Pick up the probe once and keep it on for all probing
  QUAD_GANTRY_LEVEL                                    # Level the printer via QGL
  G28 Z                                                # Home Z again after QGL

  BED_MESH_CALIBRATE ADAPTIVE=1                        # Mesh only the area the print covers

  Dock_Probe_Unlock                                    # Return the probe to the dock

  # Heat up the hotend up to target via data from slicer
  SET_DISPLAY_TEXT MSG="Hotend: {target_extruder}c"     # Display info on display
  PARK                                                  # Go to center of the bed
  M107                                                  # Turn off partcooling fan
  BED_FANS_OFF                                          # Bed fans only help while heating
  M109 S{target_extruder}                               # Heat the hotend to set temp

  # Get ready to print by doing a primeline and updating the LEDs
  SET_DISPLAY_TEXT MSG="Printer goes brr"               # Display info on display
  PRIME                                                 # Prime nozzle for printing   

[gcode_macro PRINT_END]
#   Use PRINT_END for the slicer ending script - please customise for your slicer of choice
gcode:
    # park where the toolhead rests after homing Y: X100 Y180 with the current Klicky settings
    {% set klicky = printer["gcode_macro _User_Variables"] %}
    {% set park_x = printer.configfile.settings.stepper_x.position_endstop - klicky.home_backoff_x %}
    {% set park_y = printer.configfile.settings.stepper_y.position_endstop - klicky.home_backoff_y %}
    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-10.0 F3600                ; retract filament

    G91                            ; relative positioning
    G0 Z1.00 X20.0 Y20.0 F20000    ; move nozzle to remove stringing
    TURN_OFF_HEATERS
    M107                           ; turn off fan
    G1 Z2 F3000                    ; move nozzle up 2mm
    G90                            ; absolute positioning
    G0 X{park_x} Y{park_y} F3600   ; park nozzle near the rear, clear of the umbilical
    
    BED_MESH_CLEAR                 ; drop this print's mesh
    
    # keep the filter running for 3 minutes after the print
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=180

# Enclosure fan speeds for hot beds (ASA); 1.0 is full power
[gcode_macro _ENCLOSURE_FANS]
variable_bed_fans_speed: 0.5
variable_filter_speed: 0.5
gcode:

[gcode_macro FILTER_ON]
gcode:
    # cancel a pending switch-off left over from the previous print
    UPDATE_DELAYED_GCODE ID=filter_off DURATION=0
    SET_FAN_SPEED FAN=filter SPEED={printer["gcode_macro _ENCLOSURE_FANS"].filter_speed}

[delayed_gcode filter_off]
gcode:
    SET_FAN_SPEED FAN=filter SPEED=0

[gcode_macro BED_FANS_ON]
gcode:
    SET_FAN_SPEED FAN=bed_fans SPEED={printer["gcode_macro _ENCLOSURE_FANS"].bed_fans_speed}

[gcode_macro BED_FANS_OFF]
gcode:
    SET_FAN_SPEED FAN=bed_fans SPEED=0

##########
# MACROS #
##########

[gcode_macro PARK]
gcode:
    {% set th = printer.toolhead %}
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y//2} Z30  

[gcode_macro G32]
gcode:
    BED_MESH_CLEAR
    G28
    QUAD_GANTRY_LEVEL
    G28
    G0 X87.5 Y90 Z30 F3600
    

[gcode_macro PRIME]
gcode:
  {% set x_mid = printer.toolhead.axis_maximum.x|float / 2 %}
  G0 X{x_mid - 50} Y4 F10000                           # Go to starting point
  G0 Z0.4                                               # Raise Z to 0.4
  G91                                                   # Incremental positioning 
  G1 X100 E20 F1000                                     # Primeline
  G90  

[gcode_macro PRINT_TEST_CUBE]
variable_pla_he_temp: 220
variable_pla_bed_temp: 60
variable_abs_he_temp: 265
variable_abs_bed_temp: 110
variable_abs_chamber_temp: 45
gcode:
    RESPOND TYPE=command MSG="action:prompt_begin PRINT TEST CUBE"
    RESPOND TYPE=command MSG="action:prompt_text Which material are you using?"
    RESPOND TYPE=command MSG="action:prompt_button_group_start"
    RESPOND TYPE=command MSG="action:prompt_button ABS|_PRINT_CUBE_START MATERIAL=ABS"
    RESPOND TYPE=command MSG="action:prompt_button PLA|_PRINT_CUBE_START MATERIAL=PLA"
    RESPOND TYPE=command MSG="action:prompt_button_group_end"
    RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _PRINT_CUBE_START]
gcode:
      RESPOND TYPE=command MSG="action:prompt_end"
      {% set MATERIAL = params.MATERIAL|default("XXX")|string %}
      RESPOND MSG="Printing Test Cube in {MATERIAL}"
      {% if MATERIAL == "ABS" %}
         {% set EXTRUDER = printer["gcode_macro PRINT_TEST_CUBE"].abs_he_temp%}
         {% set BED = printer["gcode_macro PRINT_TEST_CUBE"].abs_bed_temp%}
      {% elif MATERIAL == "PLA" %}
         {% set EXTRUDER = printer["gcode_macro PRINT_TEST_CUBE"].pla_he_temp%}
         {% set BED = printer["gcode_macro PRINT_TEST_CUBE"].pla_bed_temp%}
         {% set CHAMBER = 0 %}
      {% else %}
      {% endif %}

   PRINT_START EXTRUDER={EXTRUDER} BED={BED} CHAMBER={CHAMBER}
   SDCARD_PRINT_FILE FILENAME=".micron_test_cube.gcode"

[gcode_macro LOAD_FILAMENT]
description: Feed filament into the hot nozzle. LENGTH is in mm, 50 at most
gcode:
    {% set length = params.LENGTH|default(50)|float %}
    {% if not printer.extruder.can_extrude %}
        { action_raise_error("Nozzle too cold: heat it to the filament's temperature first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=load_filament
    M83
    G1 E{length} F180
    RESTORE_GCODE_STATE NAME=load_filament

[gcode_macro UNLOAD_FILAMENT]
description: Pull the filament out of the hot nozzle
gcode:
    {% if not printer.extruder.can_extrude %}
        { action_raise_error("Nozzle too cold: heat it to the filament's temperature first") }
    {% endif %}
    SAVE_GCODE_STATE NAME=unload_filament
    M83
    # a short push softens the tip, then a fast retract pulls it out before it can form a blob
    G1 E10 F180
    G1 E-50 F1200
    G1 E-50 F1200
    RESTORE_GCODE_STATE NAME=unload_filament

# Settings read by the pause and cancel macros in mainsail.cfg.
# Park at the spot where the toolhead rests after homing Y, not the default rear right corner.
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos: True
variable_custom_park_x: 100.0
variable_custom_park_y: 180.0
variable_park_at_cancel: True
gcode: