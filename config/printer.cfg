[include mainsail.cfg]
[include klicky.cfg]
[include macros.cfg]

# host MCU service is preinstalled and ready to use with:
[mcu CB1]
serial: /tmp/klipper_host_mcu

[mcu]
canbus_uuid: 193e1cfccaf3
canbus_interface: can0

[mcu EBBCan]
canbus_uuid: dcfb69ea240e
canbus_interface: can0

[printer]
kinematics: corexy
max_velocity: 200
max_accel: 5000
max_z_velocity: 25
max_z_accel: 350

################
# X/Y Steppers #
################

# Motor1
[stepper_x]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32
endstop_pin: ^EBBCan:PB6
position_endstop: 173
position_max: 173
position_min: 1
homing_speed: 60
homing_retract_dist: 5

[tmc2209 stepper_x]
uart_pin: PE3
run_current: 0.800
stealthchop_threshold: 999999

# Motor2
[stepper_y]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
full_steps_per_rotation: 200
rotation_distance: 32
endstop_pin: ^PF4
position_endstop: 190
position_max: 190
position_min: 0
homing_speed: 60
homing_retract_dist: 5

[tmc2209 stepper_y]
uart_pin: PC13
run_current: 0.800
stealthchop_threshold: 999999

##############
# Z Steppers #
##############

## Z0 Stepper - Front Left 
[stepper_z]
step_pin: PG13
dir_pin: PG12
enable_pin: !PG15
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin:  probe:z_virtual_endstop
position_max: 165
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: PG14
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	Z1 Stepper - Rear Left 
[stepper_z1]
step_pin: PG9
dir_pin: !PD7
enable_pin: !PG11
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: PG10
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	Z2 Stepper - Rear Right 
[stepper_z2]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: PB9
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##	Z3 Stepper - Front Right 
[stepper_z3]
step_pin: PB4
dir_pin: !PB3
enable_pin: !PB6
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: PB5
interpolate: true
run_current: 0.8
sense_resistor: 0.110
stealthchop_threshold: 999999

##########
# Klicky #
##########

# These sections override values from klicky.cfg, so they must stay below the include

[probe]
pin: ^EBBCan:PB9
# official value is 20, a bit too fast and it hits the bed
speed: 5
#z_offset: 5

[gcode_macro _User_Variables]
# official value is 24; 25.5 lines up with this printer's dock
variable_docklocation_x: 25.5
# official value is 50, which reaches the cable chain at the rear
variable_dockmove_x: 35
# distance from the X endstop (173) before homing Y; official 100 homes Y at X73, 73 homes it at X100
variable_home_backoff_x: 73

[quad_gantry_level]
speed: 100
horizontal_move_z: 8
retries: 5
retry_tolerance: 0.0075
max_adjust: 10
gantry_corners:
   -60.2,-10.4
   244.1,234.5
points:
   13,1
   13,140
   160,140
   160,1

[idle_timeout]
timeout: 1800

# lets Klipper understand the object labels the slicer writes, so single objects can be cancelled
[exclude_object]

###############
# Fan Control #
###############

[fan]
##	Part Cooling Fan
pin: EBBCan:PA1
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan hotend_fan]
pin: EBBCan:PA0
heater: extruder
heater_temp: 50.0
kick_start_time: 0.5
max_power: 1.0
#tachometer_pin: thb:HE_TACH  #Uncomment for Tach on NH36

# [controller_fan controller_fan]
# pin: MCU_FAN
# max_power:0.5
# kick_start_time: 0.5
# fan_speed: 1.0
# idle_speed: 0.5

############
# Extruder #
############

[extruder]
step_pin: EBBCan:PD0
dir_pin: !EBBCan:PD1
enable_pin: !EBBCan:PD2
microsteps: 16
full_steps_per_rotation: 200
# Sherpa Mini with a 10T motor gear; nominal value is 22.6789511,
# calibrated from a 50 mm extrude that fed 49 mm
rotation_distance: 22.2254
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: EBBCan:PB13
# E3D Revo thermistor
sensor_type: ATC Semitec 104NT-4-R025H42G
sensor_pin: EBBCan:PA3
#control: pid
#pid_Kp: 21.527
#pid_Ki: 1.063
#pid_Kd: 108.982
min_temp: 0
max_temp: 300
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040

[tmc2209 extruder]
uart_pin: EBBCan:PA15
# official value is 0.65; 0.5 feeds without skipping and keeps the motor cool
run_current: 0.5

##############
# Bed Heater #
##############

[heater_bed]
##	SSR Pin - HE1
heater_pin: PA1
sensor_type:Generic 3950
sensor_pin: PB1
max_power: 1
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

########
# ADXL #
########

# accelerometer on the EBB36 board
[adxl345]
cs_pin: EBBCan:PB12
spi_software_sclk_pin: EBBCan:PB10
spi_software_mosi_pin: EBBCan:PB11
spi_software_miso_pin: EBBCan:PB2
axes_map: x,y,z

[resonance_tester]
accel_chip: adxl345
accel_per_hz: 150
probe_points:
    87,90,20
max_freq: 150
sweeping_period: 0

